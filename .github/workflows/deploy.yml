name: deploy

# Manual trigger on purpose: the first deploy is the checkpoint — we press
# the button together and debug whatever the first release breaks. Only
# after it goes green do we wire it to merge-to-main (Day 5, final step).
#
# Hosting: Azure Container Apps, not App Service (see docs/adr/0003).
# The image is built in CI and pushed to the public GitHub Container
# Registry — no registry credentials on the pull side. The container app
# itself is created in the portal BEFORE this workflow runs; this job
# only swaps in the freshly built image.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/asset-tracker-api:latest
            ghcr.io/${{ github.repository }}/asset-tracker-api:${{ github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: asset-tracker-api
          # TODO: the resource group that holds the Postgres server.
          resourceGroup: asset-tracker-rg
          imageToDeploy: ghcr.io/${{ github.repository }}/asset-tracker-api:${{ github.sha }}
